[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "job-hunter"
version = "0.1.0"
description = "Evidence-aware daily job discovery and ranking with optional OpenAI Agents SDK analysis"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "PyYAML>=6,<7", "beautifulsoup4>=4.12,<5"]
[project.optional-dependencies]
ai = ["openai-agents>=0.2"]
dev = ["pytest>=8,<10", "respx>=0.21,<1"]
[project.scripts]
job-hunter = "job_hunter.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
